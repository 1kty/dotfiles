config_version = 15

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    center = [ "workspaces" ]
    end = [ "tray", "notifications", "volume", "brightness", "battery", "control-center" ]
    margin_edge = 6
    margin_ends = 8
    start = [ "launcher", "clock", "cpu", "temp", "ram", "media" ]
    widget_spacing = 12

[battery]
warning_threshold = 20

[calendar]
enabled = true


    [calendar.reminders]
    default_lead_minutes = 0
    enabled = false

[control_center]
sidebar_section = "none"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen]
blur_intensity = 0.0
transition = []

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@winit",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1920.0
    cy = 1978.0
    output = "HDMI-A-1"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 704.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface"
        background_opacity = 1.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 706.0
    cy = 1498.0
    output = "winit"
    placement_height = 1680.0
    placement_width = 1412.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 720.0
    cy = 177.5
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 1.0
        clock_style = "digital"

[notification]
history_retention_hours = 24
offset_x = 8

[osd]
offset_x = 8
position = "top_right"

    [osd.kinds]
    media = false

[plugins]
enabled = []

[shell]
button_borders = false
card_borders = false
font_family = "JetBrains Mono"
input_borders = false
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
popup_borders = false

    [shell.launcher]
    default_view = "pinned"
    pinned = [ "zen", "obsidian", "code", "chatgpt", "vesktop", "spotify", "zotero", "chromium", "localsend" ]

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.panels]
        global = false

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.wallpaper]
        global = false

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 10.0
    enabled = true
    label = "Suspend"
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 10.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "niri" ]
    community_ids = [ "claude-code", "codex", "opencode", "telegram", "zathura", "yazi" ]

[wallpaper]
transition = [ "fade" ]

[widget.control-center]
glyph = "lambda"

[widget.cpu]
show_value = false

[widget.media]
artist_first = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.ram]
show_value = false

[widget.temp]
show_value = false

[widget.tray]
drawer = true