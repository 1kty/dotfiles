general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock
    before_sleep_cmd = qs -c noctalia-shell ipc call lockScreen lock
    after_sleep_cmd = niri msg action power-on-monitors && brightnessctl -r
}

listener {
    timeout = 270 # 4.5 minutes
    on-timeout = brightnessctl -s set 10% # lower backlight
    on-resume = brightnessctl -r
}

listener {
    timeout = 270 # 4.5 minutes
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0 # turns off keyboard backlight
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

listener {
    timeout = 300 # 5 minutes
    on-timeout = qs -c noctalia-shell ipc call lockScreen lock # locks session
}

listener {
    timeout = 330 # 5 minutes 30 seconds
    on-timeout = niri msg action power-off-monitors # turns screen off
    on-resume = niri msg action power-on-monitors && brightnessctl -r
}

listener {
    timeout = 900 # 15 minutes
    on-timeout = systemctl suspend # auto-suspend
}
